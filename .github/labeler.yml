# 人間が差分を精読してからマージすべきPRに high-risk ラベルを付ける（#312）。
# 運用ルールは CLAUDE.md の「PRのレビュー」を参照。
# バグがすり抜けたら、該当パスをここへ追加するか、lint・テストに変換する。
#
# 区分（risk:*）ごとに見るべき観点が違うため、区分のラベルも付ける（#476）。
# 区分ごとの確認観点は docs/review-checklists/<区分>.md（risk:db → db.md）にあり、
# PR Diff Summary のコメントに該当するファイルとチェックリストが出る（scripts/ci/review-checklists.ts）。
#
# パスを足すときは、区分と high-risk の両方に足す（high-risk = 区分の和集合であることを
# tests/unit/review-checklists.test.ts が検査する）。書き方は changed-files の any-glob-to-any-file だけにする
# （scripts/ci/review-checklists.ts はこの形だけを読む）。

# スキーマ・RLS
risk:db:
  - changed-files:
      - any-glob-to-any-file:
          - "supabase/migrations/**"

# Stripe・ClerkのWebhook
risk:webhook:
  - changed-files:
      - any-glob-to-any-file:
          - "src/app/api/webhooks/**"
          - "src/lib/webhook/**"

# 認証・認可（ルート保護・ログインユーザー取得・RLSを迂回するservice roleクライアント）
risk:auth:
  - changed-files:
      - any-glob-to-any-file:
          - "src/middleware.ts"
          - "src/lib/auth/**"
          - "src/lib/supabase/server-admin.ts"

# 決済・注文・金額計算
risk:payment:
  - changed-files:
      - any-glob-to-any-file:
          - "src/lib/stripe.ts"
          - "src/infrastructure/stripe/**"
          - "src/use-cases/place-order.ts"
          - "src/use-cases/cancel-order.ts"
          - "src/use-cases/mark-checkout-order-as-paid.ts"
          - "src/use-cases/mark-invoice-order-as-paid.ts"
          - "src/use-cases/select-plan.ts"
          - "src/use-cases/complete-subscription-onboarding.ts"
          - "src/domain/entities/order*.ts"
          - "src/domain/value-objects/money.ts"
          - "src/domain/value-objects/order-status.ts"
          - "src/domain/services/**"
          - "src/app/(member)/order/checkout/actions.ts"
          - "src/app/admin/orders/**/actions.ts"
          - "src/app/onboarding/plan/actions.ts"
          - "src/app/onboarding/payment/**"

# ゲート自体を弱める変更（CI・権限設定・lint・完了チェック）
risk:gate:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - ".claude/settings.json"
          - "eslint.config.mjs"
          - "Taskfile.yml"
          - "scripts/ci/**"

# 依存の追加・更新（スクリプトだけの変更も区別できないため対象にする）
risk:deps:
  - changed-files:
      - any-glob-to-any-file:
          - "package.json"
          - "pnpm-lock.yaml"

high-risk:
  - changed-files:
      - any-glob-to-any-file:
          # risk:db
          - "supabase/migrations/**"
          # risk:webhook
          - "src/app/api/webhooks/**"
          - "src/lib/webhook/**"
          # risk:auth
          - "src/middleware.ts"
          - "src/lib/auth/**"
          - "src/lib/supabase/server-admin.ts"
          # risk:payment
          - "src/lib/stripe.ts"
          - "src/infrastructure/stripe/**"
          - "src/use-cases/place-order.ts"
          - "src/use-cases/cancel-order.ts"
          - "src/use-cases/mark-checkout-order-as-paid.ts"
          - "src/use-cases/mark-invoice-order-as-paid.ts"
          - "src/use-cases/select-plan.ts"
          - "src/use-cases/complete-subscription-onboarding.ts"
          - "src/domain/entities/order*.ts"
          - "src/domain/value-objects/money.ts"
          - "src/domain/value-objects/order-status.ts"
          - "src/domain/services/**"
          - "src/app/(member)/order/checkout/actions.ts"
          - "src/app/admin/orders/**/actions.ts"
          - "src/app/onboarding/plan/actions.ts"
          - "src/app/onboarding/payment/**"
          # risk:gate
          - ".github/**"
          - ".claude/settings.json"
          - "eslint.config.mjs"
          - "Taskfile.yml"
          - "scripts/ci/**"
          # risk:deps
          - "package.json"
          - "pnpm-lock.yaml"
