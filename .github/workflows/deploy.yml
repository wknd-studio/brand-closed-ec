name: Deploy

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # docs/・specs/・*.mdのみの変更（仕様駆動開発のドキュメントPR等）ではE2Eを走らせない
          filters: |
            code:
              - '!(docs/**|specs/**|**/*.md)'

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  e2e-pr:
    name: E2E Tests (PR)
    runs-on: ubuntu-latest
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "pnpm" }
      - uses: supabase/setup-cli@v1
        with: { version: 2.102.0 }
      - uses: dopplerhq/cli-action@v3
      - run: pnpm install --frozen-lockfile
      - name: Get installed Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright Chromium (ブラウザ本体・OS依存パッケージ両方)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Playwright OS依存パッケージのみ（ブラウザ本体はキャッシュ済み）
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: Install Stripe CLI
        run: npm install -g @stripe/cli
      - name: Start local Supabase
        run: supabase start
      - name: Apply local migrations
        run: supabase db reset
      - name: Run E2E tests
        # Clerk/Stripe/Sanity等のテスト用シークレットはstaging Doppler環境から取得するが、
        # Supabase関連（URL・キー）だけはこのジョブ内で起動したローカルのSupabaseを
        # 明示的に上書きして使う（本物のstg DBには一切アクセスしない）。
        # stripe listenはローカルのtask dev:stripeと同じ役割（Stripe Webhookを
        # localhost:3000へ転送）で、これがないと決済確定後のWebhook処理がテストで
        # 検証できない。署名シークレット（STRIPE_WEBHOOK_SECRET）はStripeアカウント
        # に紐づく固定値のため、Doppler側に設定済みの値をそのまま使う
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          doppler run -- stripe listen --forward-to localhost:3000/api/webhooks/stripe &
          doppler run -- env \
            NEXT_PUBLIC_SUPABASE_URL="$API_URL" \
            NEXT_PUBLIC_SUPABASE_ANON_KEY="$PUBLISHABLE_KEY" \
            SUPABASE_SERVICE_ROLE_KEY="$SECRET_KEY" \
            NEXT_PUBLIC_APP_URL="http://localhost:3000" \
            pnpm test:e2e
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      - name: Upload Playwright report (動画・トレース含む)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-pr
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy-stg:
    name: Deploy (staging)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    environment: staging
    # developへの複数マージがほぼ同時に発生すると、stgデプロイとE2E検証が
    # 同時に走り、共有のClerkテストインスタンスへの同時アクセスでレート制限
    # （ボット検知）にかかりE2Eが不安定に失敗する事象が実際に発生した。
    # deploy-stgとe2e（stg検証）を同じグループにして直列化し、各pushの
    # デプロイ→検証が完全に終わってから次のpushの分を開始する。古い方を
    # キャンセルすると中途半端な状態でデプロイが止まる恐れがあるため
    # cancel-in-progressは使わずキューイングする
    concurrency:
      group: stg-deploy-and-verify
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "pnpm" }
      - uses: supabase/setup-cli@v1
        with: { version: 2.102.0 }
      - uses: dopplerhq/cli-action@v3
      - run: pnpm install --frozen-lockfile
      - name: Migrate DB
        run: doppler run -- sh -c 'supabase link --project-ref $SUPABASE_PROJECT_REF && supabase db push --linked'
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      - name: Build
        run: doppler run -- pnpm build:cloudflare
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      - name: Sync Wrangler Secrets & Deploy
        run: |
          doppler run -- sh -c 'doppler secrets download --no-file --format json | pnpm exec wrangler secret bulk --config wrangler.stg.jsonc'
          doppler run -- pnpm exec wrangler deploy --config wrangler.stg.jsonc
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}

  deploy-prod:
    name: Deploy (production)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "pnpm" }
      - uses: supabase/setup-cli@v1
        with: { version: 2.102.0 }
      - uses: dopplerhq/cli-action@v3
      - run: pnpm install --frozen-lockfile
      - name: Migrate DB
        run: doppler run -- sh -c 'supabase link --project-ref $SUPABASE_PROJECT_REF && supabase db push --linked'
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      - name: Build
        run: doppler run -- pnpm build:cloudflare
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      - name: Sync Wrangler Secrets & Deploy
        run: |
          doppler run -- sh -c 'doppler secrets download --no-file --format json | pnpm exec wrangler secret bulk --config wrangler.prod.jsonc'
          doppler run -- pnpm exec wrangler deploy --config wrangler.prod.jsonc
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}

  e2e:
    name: E2E Tests (stg)
    runs-on: ubuntu-latest
    needs: [deploy-stg]
    if: github.ref == 'refs/heads/develop'
    environment: staging
    # deploy-stgと同じグループで直列化する（上のdeploy-stgのコメント参照）。
    # 同じグループ名にすることで、deploy-stg→e2eの一連の流れ全体が
    # 他のpushの分と重ならないようにする
    concurrency:
      group: stg-deploy-and-verify
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "pnpm" }
      - uses: dopplerhq/cli-action@v3
      - run: pnpm install --frozen-lockfile
      - name: Get installed Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright Chromium (ブラウザ本体・OS依存パッケージ両方)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Playwright OS依存パッケージのみ（ブラウザ本体はキャッシュ済み）
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: Wait for stg to be ready
        run: |
          doppler run -- sh -c '
            for i in $(seq 1 12); do
              if curl -sf "$NEXT_PUBLIC_APP_URL" > /dev/null; then
                echo "stg is ready"
                exit 0
              fi
              echo "Waiting... ($i/12)"
              sleep 10
            done
            echo "stg did not become ready in time"
            exit 1
          '
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      - name: Run E2E tests
        run: doppler run -- sh -c 'BASE_URL=$NEXT_PUBLIC_APP_URL pnpm test:e2e'
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      - name: Upload Playwright report (動画・トレース含む)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-stg
          path: |
            playwright-report/
            test-results/
          retention-days: 7
