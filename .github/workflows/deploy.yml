name: Deploy

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:cloudflare

      - name: Deploy to prod
        if: github.ref == 'refs/heads/main'
        run: pnpm exec wrangler pages deploy .open-next/assets --project-name brand-closed-ec-prod --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to stg
        if: github.ref == 'refs/heads/develop'
        run: pnpm exec wrangler pages deploy .open-next/assets --project-name brand-closed-ec-stg --branch develop
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy preview (feature branch)
        if: startsWith(github.ref, 'refs/heads/feature/')
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          pnpm exec wrangler pages deploy .open-next/assets --project-name brand-closed-ec-prod --branch "$BRANCH"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
