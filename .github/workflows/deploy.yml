name: Deploy

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  deploy-stg:
    name: Deploy (staging)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "pnpm" }
      - uses: supabase/setup-cli@v1
        with: { version: 2.102.0 }
      - uses: dopplerhq/cli-action@v3
      - run: pnpm install --frozen-lockfile
      - name: Migrate DB
        run: doppler run -- sh -c 'supabase link --project-ref $SUPABASE_PROJECT_REF && supabase db push --linked'
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      - name: Build
        run: doppler run -- pnpm build:cloudflare
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      - name: Sync Wrangler Secrets & Deploy
        run: |
          doppler run -- sh -c 'doppler secrets download --no-file --format json | pnpm exec wrangler secret bulk --config wrangler.stg.jsonc'
          doppler run -- pnpm exec wrangler deploy --config wrangler.stg.jsonc
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}

  deploy-prod:
    name: Deploy (production)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "pnpm" }
      - uses: supabase/setup-cli@v1
        with: { version: 2.102.0 }
      - uses: dopplerhq/cli-action@v3
      - run: pnpm install --frozen-lockfile
      - name: Migrate DB
        run: doppler run -- sh -c 'supabase link --project-ref $SUPABASE_PROJECT_REF && supabase db push --linked'
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      - name: Build
        run: doppler run -- pnpm build:cloudflare
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      - name: Sync Wrangler Secrets & Deploy
        run: |
          doppler run -- sh -c 'doppler secrets download --no-file --format json | pnpm exec wrangler secret bulk --config wrangler.prod.jsonc'
          doppler run -- pnpm exec wrangler deploy --config wrangler.prod.jsonc
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}

  e2e:
    name: E2E Tests (stg)
    runs-on: ubuntu-latest
    needs: [deploy-stg]
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "pnpm" }
      - uses: dopplerhq/cli-action@v3
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Wait for stg to be ready
        run: |
          doppler run -- sh -c '
            for i in $(seq 1 12); do
              if curl -sf "$NEXT_PUBLIC_APP_URL" > /dev/null; then
                echo "stg is ready"
                exit 0
              fi
              echo "Waiting... ($i/12)"
              sleep 10
            done
            echo "stg did not become ready in time"
            exit 1
          '
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      - name: Run E2E tests
        run: doppler run -- sh -c 'BASE_URL=$NEXT_PUBLIC_APP_URL pnpm test:e2e'
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
