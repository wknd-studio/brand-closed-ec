name: Migration Order

# developの最新より古いタイムスタンプのマイグレーションを追加したPRを失敗させる（#318）。
# stg・prodの `supabase db push --linked` は適用済みの最新より古いファイルを拒否するため、
# マージ順とタイムスタンプ順のずれをマージ前に止める
on:
  # 必須チェックに登録するため、マイグレーションを変更しないPRでも常に実行する
  # （変更が無ければスクリプトが即成功する）
  pull_request:
    branches: [develop]
  # merge queue（#329）。PRのチェック後に別のPRがより新しいマイグレーションをマージしていても、
  # キューの一時ブランチ（最新のdevelop＋前に並んだPR＋このPR）で比べ直すため取りこぼさない
  merge_group:
    types: [checks_requested]

jobs:
  migration-order:
    name: Migration Order
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Check migration timestamps against the latest on base branch
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          bash scripts/ci/check-migration-order.sh "origin/${{ github.base_ref }}" "${{ github.event.pull_request.head.sha }}"
      - name: Check migration timestamps in merge queue order
        if: github.event_name == 'merge_group'
        run: |
          bash scripts/ci/check-migration-order.sh --merge-group \
            "${{ github.event.merge_group.base_sha }}" "${{ github.event.merge_group.head_sha }}"
