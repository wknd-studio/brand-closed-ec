name: Preview

# PRごとのプレビュー（#727）のビルド。マイグレーションを含まない develop 向けのPRのコードを、stg の値でビルドし、
# 成果物を artifact に上げる。デプロイ・削除・PRへのコメントは、この実行の完了で動く preview-deploy.yml が行う。
# 方式・シークレットの置き場所は docs/cicd.md の「PRごとのプレビュー」、人間の確かめ方は docs/manual-check.md。
#
# pull_request のワークフローはPR側の定義で動き、PRのコードを動かす。Cloudflare のトークンはアカウント単位で
# 本番の Worker にも届くため、このワークフローには渡さない（stg の値を読むトークンだけ）。書き込みの権限も持たない。
# - fork のPR・Dependabot のPR・feature/* 以外のブランチではビルドしない（stg のシークレットをPRのコードに渡さない）。
#   preview-build の environment も feature/* だけが使えるよう絞る
# - マイグレーション（supabase/migrations/）を含むPRはビルドしない
on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, closed]

# push が続いたら最後のコードだけをビルドする
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  record:
    name: Record PR
    # preview-deploy.yml がどのPRの実行かを知るため、PR番号を毎回（閉じたときも）上げる。
    # PRのコードが中身を変えられるため、preview-deploy.yml は API で読んだPRの状態と照らして使う
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - run: echo "$PR_NUMBER" > pr-number
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
      - uses: actions/upload-artifact@v4
        with:
          name: preview-pr
          path: pr-number
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build preview
    runs-on: ubuntu-24.04
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      startsWith(github.event.pull_request.head.ref, 'feature/')
    environment: preview-build
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Detect migrations
        uses: dorny/paths-filter@v3
        id: migrations
        with:
          filters: |
            migrations:
              - 'supabase/migrations/**'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "pnpm" }
      - uses: ./.github/actions/install-cli
        with: { tool: doppler, version: 3.77.1 }
      - run: pnpm install --frozen-lockfile
      - name: Resolve preview name and URL
        id: preview
        run: pnpm -s tsx scripts/ci/preview.ts names "$PR_NUMBER" >> "$GITHUB_OUTPUT"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
      - name: Build
        # NEXT_PUBLIC_* はビルド時にバンドルへ埋め込まれるため、アプリのURLをプレビューのURLにしてPRごとにビルドする
        # （Stripe Checkout の戻り先・招待リンクが stg に飛ばないように）。Worker 用の config（stg）だけを読む。
        # SENTRY_AUTH_TOKEN が無いため、ソースマップは Sentry に上げない。Sentry のイベントは stg と分ける
        if: steps.migrations.outputs.migrations != 'true'
        run: |
          doppler run -- env \
            NEXT_PUBLIC_APP_URL="$PREVIEW_URL" \
            NEXT_PUBLIC_SENTRY_ENVIRONMENT="preview" \
            pnpm build:cloudflare
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_WORKER }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
      - name: Package build output
        # .open-next にはリンク切れのシンボリックリンク（node_modules）があり、Worker のバンドルには要らない。
        # デプロイ側でランナーのファイルを指すリンクを読ませないよう、消してから固める
        if: steps.migrations.outputs.migrations != 'true'
        run: |
          find .open-next -type l -delete
          tar -czf "$RUNNER_TEMP/preview-build.tgz" .open-next
      - name: Upload build output
        # 中身は NEXT_PUBLIC_* だけが埋め込まれたビルドの成果物（サーバー側のシークレットは実行時に読む）
        if: steps.migrations.outputs.migrations != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: preview-build
          path: ${{ runner.temp }}/preview-build.tgz
          if-no-files-found: error
          retention-days: 1
