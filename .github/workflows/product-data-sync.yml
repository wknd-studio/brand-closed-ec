name: Product Data Sync

on:
  workflow_dispatch:
    inputs:
      catalogId:
        description: "実行対象のscrapingCatalogドキュメントID（今すぐ実行）"
        required: true
        type: string

jobs:
  on-demand:
    name: On-demand scraping
    runs-on: ubuntu-latest
    # 業者データはSanityの単一（production）データセットへ書き込む対象のため、
    # 常にproduction Doppler環境から資格情報を取得する（requirements.md参照）
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "pnpm" }
      - uses: dopplerhq/cli-action@v3
      - run: pnpm install --frozen-lockfile
      - name: Run on-demand import
        run: doppler run -- pnpm tsx scripts/product-import/run-on-demand.ts --catalog="${{ inputs.catalogId }}"
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
