name: Secret Scan

# PR の commit に機密情報（API キー・秘密鍵・トークン）が無いかを gitleaks で確かめる（#663）。
# GitHub の secret scanning は GitHub が形を知っているサービスの鍵しか見ないため、gitleaks の
# 既定のルールでも調べる。誤検出は .gitleaks.toml の allowlist に理由付きで足す。
# gitleaks の公式の action は Organization のリポジトリでは有料のライセンスキーが要るため使わず、
# CLI を install-cli で入れる。ブランチ保護の必須のチェックにするため、paths で絞らない
on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # base から head までの commit を辿るため、履歴を全部取る
          fetch-depth: 0
      - uses: ./.github/actions/install-cli
        with: { tool: gitleaks, version: 8.30.1 }
      - name: Scan PR commits
        # 調べるのは PR で足した commit だけ（develop・main にある commit は含めない）。
        # 見つけた値はログに出さない（--redact）
        run: gitleaks git --log-opts="$BASE_SHA..$HEAD_SHA" --redact --no-banner --verbose .
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
