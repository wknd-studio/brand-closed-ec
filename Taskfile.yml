version: "3"

tasks:
  dev:
    desc: 開発サーバーを起動（Supabase → Next.js + Stripe 並列）※ ngrok は task dev:ngrok で別途起動
    cmds:
      - task: supabase:start
      - task: dev:services

  supabase:start:
    desc: Supabase ローカルDBを起動
    cmds:
      - supabase start

  dev:services:
    desc: Next.js・Stripe を並列起動
    deps:
      - dev:next
      - dev:stripe

  dev:next:
    desc: Next.js 開発サーバー
    cmds:
      - pnpm next dev --turbo

  dev:stripe:
    desc: Stripe Webhook を localhost:3000 へ転送
    cmds:
      - stripe listen --forward-to localhost:3000/api/webhooks/stripe

  dev:ngrok:
    desc: ngrok トンネルを起動（buffing-flaccid-nutty.ngrok-free.dev → localhost:3000）
    cmds:
      - ngrok start default --config "$HOME/Library/Application Support/ngrok/ngrok.yml" --config ngrok.yml

  seed:
    desc: 開発用シードデータを一括投入（Supabaseユーザー → Sanity商品）
    cmds:
      - task: supabase:seed-users
      - task: sanity:seed

  supabase:seed-users:
    desc: Supabase ローカルDBに開発用ユーザーをシード（Clerkに存在するユーザーのみ）
    cmds:
      - pnpm tsx scripts/seed-users.ts

  sanity:seed:
    desc: Sanity にダミー商品を登録する（開発用・べき等）
    cmds:
      - pnpm tsx scripts/seed-products.ts

  sanity:dev:
    desc: Sanity Studio をローカルで起動する（動作確認用。公開URLには影響しない）
    cmds:
      - pnpm sanity dev

  sanity:deploy:
    desc: Sanity Studio をホスティングサービスにデプロイする
    cmds:
      - pnpm sanity deploy
