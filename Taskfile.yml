version: "3"

tasks:
  dev:
    desc: 開発環境を一括起動（Supabase → ngrokを別ターミナルで起動 → Next.js + Stripe + Sanity Studio 並列）
    cmds:
      - task: supabase:start
      - task: dev:ngrok:spawn
      - task: dev:services

  supabase:start:
    desc: Supabase ローカルDBを起動
    cmds:
      - supabase start

  dev:ngrok:spawn:
    desc: ngrok を別のTerminalウィンドウで起動する（同一プロセス内で他コマンドと出力を共有するとTUI表示が崩れるため）
    cmds:
      - osascript -e 'tell application "Terminal" to do script "cd \"'"$PWD"'\" && task dev:ngrok"'

  dev:services:
    desc: Next.js・Stripe・Sanity Studio を並列起動
    deps:
      - dev:next
      - dev:stripe
      - sanity:dev

  dev:next:
    desc: Next.js 開発サーバー
    cmds:
      - doppler run -- pnpm next dev --turbo

  dev:stripe:
    desc: Stripe Webhook を localhost:3000 へ転送
    cmds:
      - doppler run -- stripe listen --forward-to localhost:3000/api/webhooks/stripe

  test:e2e:
    desc: E2Eテストをローカルで実行（Dopplerからシークレットを注入）
    cmds:
      - doppler run -- pnpm test:e2e

  test:integration:
    desc: 統合テストをローカルで実行（Dopplerからシークレットを注入、実DBに接続）
    cmds:
      - doppler run -- pnpm test:integration

  preview:
    desc: Cloudflare Workers本番相当ビルドをローカルでプレビュー（wrangler dev）
    cmds:
      # NEXT_PUBLIC_*はビルド時にクライアントバンドルへ埋め込まれるため、
      # ビルドもdoppler runで正しい環境変数がある状態で実行する必要がある
      - doppler run -- pnpm run build:cloudflare
      - doppler run -- env CLOUDFLARE_INCLUDE_PROCESS_ENV=true pnpm exec wrangler dev --port 3000

  dev:ngrok:
    desc: ngrok トンネルを起動（buffing-flaccid-nutty.ngrok-free.dev → localhost:3000）
    cmds:
      - ngrok start default --config "$HOME/Library/Application Support/ngrok/ngrok.yml" --config ngrok.yml

  dev:clean:
    desc: task dev で起動した全プロセス（Next.js・Stripe・Sanity Studio・ngrok・Supabaseコンテナ）を停止する
    cmds:
      - pkill -f "pnpm next dev --turbo" || true
      - pkill -f "sanity dev" || true
      - pkill -f "stripe listen" || true
      - pkill -f "ngrok start" || true
      - supabase stop

  dev:re:
    desc: task dev で起動した全プロセスを停止してから再起動する
    cmds:
      - task: dev:clean
      - task: dev

  seed:
    desc: 開発用シードデータを一括投入（Supabaseユーザー → Sanity商品）
    cmds:
      - task: supabase:seed-users
      - task: sanity:seed

  supabase:seed-users:
    desc: ローカルDBに各ランク+管理者の開発用ユーザーをシード（Clerkに無ければ新規作成）
    cmds:
      - doppler run -- pnpm tsx scripts/seed-users.ts

  supabase:seed-users:stg:
    desc: stg Supabaseに各ランク+管理者の開発用ユーザーをシード（Clerk/Sanityはlocalと共用）
    cmds:
      - doppler run -c stg -- pnpm tsx scripts/seed-users.ts

  sanity:seed:
    desc: Sanity にダミー商品を登録する（開発用・べき等）
    cmds:
      - doppler run -- pnpm tsx scripts/seed-products.ts

  sanity:dev:
    desc: Sanity Studio をローカルで起動する（動作確認用。公開URLには影響しない）
    cmds:
      - doppler run -- pnpm sanity dev

  sanity:deploy:
    desc: Sanity Studio をホスティングサービスにデプロイする
    cmds:
      - doppler run -- pnpm sanity deploy
