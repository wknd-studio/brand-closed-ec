version: "3"

tasks:
  dev:
    desc: 開発環境を一括起動（Supabase → ngrokを別ターミナルで起動 → Next.js + Stripe + Sanity Studio 並列）
    cmds:
      - cmd: bash scripts/require-main-checkout.sh "{{.TASK}}"
        silent: true
      - task: supabase:start
      - task: dev:ngrok:spawn
      - task: dev:services

  supabase:start:
    desc: Supabase ローカルDBを起動
    cmds:
      - cmd: bash scripts/require-main-checkout.sh "{{.TASK}}"
        silent: true
      - supabase start

  db:schema:
    desc: ローカルDBの今の定義を supabase/schemas/ に書き出す（先に supabase db reset。マイグレーションを手で書いたとき・sync の結果の確認に使う。CIの Schema Files Drift が食い違いを検査する）
    cmds:
      - bash scripts/with-worktree-db.sh bash scripts/db-schema-snapshot.sh

  db:sync:
    desc: supabase/schemas/ とマイグレーションの差を、マイグレーションとして書き出す（task db:sync -- <名前>。手順は docs/declarative-schema.md）
    cmds:
      - bash scripts/with-worktree-db.sh bash scripts/db-schema-sync.sh {{.CLI_ARGS}}

  dev:ngrok:spawn:
    desc: ngrok を別のTerminalウィンドウで起動する（同一プロセス内で他コマンドと出力を共有するとTUI表示が崩れるため）
    cmds:
      - cmd: bash scripts/require-main-checkout.sh "{{.TASK}}"
        silent: true
      - osascript -e 'tell application "Terminal" to do script "cd \"'"$PWD"'\" && task dev:ngrok"'

  dev:services:
    desc: Next.js・Stripe・Sanity Studio を並列起動
    cmds:
      - cmd: bash scripts/require-main-checkout.sh "{{.TASK}}"
        silent: true
      - task: dev:services:run

  dev:services:run:
    internal: true
    deps:
      - dev:next
      - dev:stripe
      - sanity:dev

  dev:next:
    desc: Next.js 開発サーバー
    cmds:
      - cmd: bash scripts/require-main-checkout.sh "{{.TASK}}"
        silent: true
      # ポートを明示すると、3000が使用中でも次の空きポート（ワークツリーのスロット2以降のポート）へ移らずエラーで止まる
      - doppler run -- pnpm next dev --turbo --port 3000

  dev:stripe:
    desc: Stripe Webhook を localhost:3000 へ転送
    cmds:
      - cmd: bash scripts/require-main-checkout.sh "{{.TASK}}"
        silent: true
      - doppler run -- stripe listen --forward-to localhost:3000/api/webhooks/stripe

  test:e2e:
    desc: E2Eテストをローカルで実行（ワークツリーではそのスロットのSupabaseを自動起動して使う）
    cmds:
      - bash scripts/with-worktree-db.sh pnpm test:e2e

  test:integration:
    desc: 統合テストをローカルで実行（ワークツリーではそのスロットのSupabaseを自動起動して使う）
    cmds:
      - bash scripts/with-worktree-db.sh pnpm test:integration

  check:
    desc: push・PR作成前の完了チェック（typecheck → lint → ユニットテスト → 統合テスト）。どれかが失敗すると中断する
    cmds:
      - pnpm typecheck
      - pnpm lint
      - pnpm test
      - task: test:integration

  worktree:list:
    desc: 既存worktree一覧を表示する（並列実装中のworktreeを確認する用途。docs/dev-parallel-worktrees.md参照）
    cmds:
      - git worktree list

  secrets:check:
    desc: GitHubのsecretsに develop・main の .github/ から参照されていないものが無いか、environment のデプロイできるブランチが production=main・staging=develop だけかを確かめる（リポジトリの管理者の権限が要る。#673）
    cmds:
      - git fetch -q origin develop main
      - pnpm -s tsx scripts/check-github-secrets.ts

  env:check:
    desc: Doppler の config（`-- stg` か `-- prod`）の名前・値と、Stripe・Clerk・Supabase の設定がそろっているかを確かめる（値は出さない。prod の読み取り権限が要るため CI では流さない。#698）
    cmds:
      - pnpm -s tsx scripts/check-env.ts {{.CLI_ARGS}}

  deps:graph:
    desc: オープンなissueの依存グラフをHTMLで開く（`-- --json` でAI・スクリプト向けのJSONを出力）。依存の正はGitHubのBlocked by
    cmds:
      - pnpm -s tsx scripts/issue-deps-graph.ts {{.CLI_ARGS}}

  preview:
    desc: Cloudflare Workers本番相当ビルドをローカルでプレビュー（wrangler dev）
    cmds:
      # NEXT_PUBLIC_*はビルド時にクライアントバンドルへ埋め込まれるため、
      # ビルドもdoppler runで正しい環境変数がある状態で実行する必要がある
      - doppler run -- pnpm run build:cloudflare
      - doppler run -- env CLOUDFLARE_INCLUDE_PROCESS_ENV=true pnpm exec wrangler dev --port 3000

  dev:ngrok:
    desc: ngrok トンネルを起動（buffing-flaccid-nutty.ngrok-free.dev → localhost:3000）
    cmds:
      - cmd: bash scripts/require-main-checkout.sh "{{.TASK}}"
        silent: true
      - ngrok start default --config "$HOME/Library/Application Support/ngrok/ngrok.yml" --config ngrok.yml

  dev:clean:
    desc: task dev で起動した全プロセス（Next.js・Stripe・Sanity Studio・ngrok・Supabaseコンテナ）を停止する
    cmds:
      - cmd: bash scripts/require-main-checkout.sh "{{.TASK}}"
        silent: true
      - pkill -f "pnpm next dev --turbo" || true
      - pkill -f "sanity dev" || true
      - pkill -f "stripe listen" || true
      - pkill -f "ngrok start" || true
      - supabase stop

  dev:re:
    desc: task dev で起動した全プロセスを停止してから再起動する
    cmds:
      - task: dev:clean
      - task: dev

  seed:
    desc: 開発用シードデータを一括投入（Supabaseユーザー → シナリオの注文 → Sanity商品）
    cmds:
      - task: supabase:seed-users
      - task: supabase:seed-scenarios
      - task: sanity:seed

  supabase:seed-users:
    desc: ローカルDBに各ランク+管理者の開発用ユーザーをシード（Clerkに無ければ新規作成）
    cmds:
      - doppler run -- pnpm tsx scripts/seed-users.ts

  supabase:seed-users:stg:
    desc: stgのClerk・Supabaseに各ランク+管理者の開発用ユーザーをシード（Clerkはlocalと別のインスタンス）
    cmds:
      - doppler run -c stg_deploy -- pnpm tsx scripts/seed-users.ts

  supabase:seed-scenarios:
    desc: ローカルDBのテスト用アカウントに各状態の注文（シナリオのデータ）を入れる（べき等。先に supabase:seed-users）
    cmds:
      - doppler run -- pnpm tsx scripts/seed-scenarios.ts

  supabase:seed-scenarios:stg:
    desc: stgのSupabaseのテスト用アカウントに各状態の注文（シナリオのデータ）を入れる（べき等。先に supabase:seed-users:stg）
    cmds:
      - doppler run -c stg_deploy -- pnpm tsx scripts/seed-scenarios.ts

  sanity:seed:
    desc: Sanity にダミー商品を登録する（開発用・べき等）
    cmds:
      - doppler run -- pnpm tsx scripts/seed-products.ts

  sanity:dev:
    desc: Sanity Studio をローカルで起動する（動作確認用。公開URLには影響しない）
    cmds:
      - doppler run -- pnpm sanity dev

  sanity:deploy:
    desc: Sanity Studio をホスティングサービスにデプロイする
    cmds:
      - doppler run -- pnpm sanity deploy
