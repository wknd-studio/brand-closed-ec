version: "3"

tasks:
  dev:
    desc: 開発サーバーを起動（Supabase → Next.js + Stripe 並列）※ ngrok は task dev:ngrok で別途起動
    cmds:
      - task: supabase:start
      - task: dev:services

  supabase:start:
    desc: Supabase ローカルDBを起動
    cmds:
      - supabase start

  dev:services:
    desc: Next.js・Stripe を並列起動
    deps:
      - dev:next
      - dev:stripe

  dev:next:
    desc: Next.js 開発サーバー
    cmds:
      - pnpm next dev

  dev:stripe:
    desc: Stripe Webhook を localhost:3000 へ転送
    cmds:
      - stripe listen --forward-to localhost:3000/api/webhooks/stripe

  dev:ngrok:
    desc: ngrok トンネルを起動（buffing-flaccid-nutty.ngrok-free.dev → localhost:3000）
    cmds:
      - ngrok start default --config "$HOME/Library/Application Support/ngrok/ngrok.yml" --config ngrok.yml

  sanity:seed:
    desc: Sanity にダミー商品を登録する（開発用・べき等）
    cmds:
      - pnpm tsx scripts/seed-products.ts

  sanity:deploy:
    desc: Sanity Studio をホスティングサービスにデプロイする
    cmds:
      - pnpm sanity deploy
